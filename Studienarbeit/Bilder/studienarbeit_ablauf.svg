<svg width="100%" viewBox="0 0 820 720" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Ablaufdiagramm Studienarbeit Aktienkursvorhersage</title>
  <desc>Übersicht des methodischen Vorgehens von der Aktienauswahl über Modellentwicklung bis zur Evaluation</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- SCHRITT 1: Aktienuniversum -->
  <rect x="285" y="20" width="250" height="52" rx="8" fill="rgb(241, 239, 232)" stroke="rgb(95, 94, 90)" stroke-width="0.5"/>
  <text x="410" y="40" text-anchor="middle" dominant-baseline="central" fill="rgb(68, 68, 65)" font-size="14" font-weight="500">Aktienuniversum</text>
  <text x="410" y="58" text-anchor="middle" dominant-baseline="central" fill="rgb(95, 94, 90)" font-size="12">S&amp;P 500 (500 Aktien)</text>

  <!-- Pfeil 1 -->
  <line x1="410" y1="72" x2="410" y2="108" stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 2: SDE Auswahl -->
  <rect x="240" y="108" width="340" height="52" rx="8" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="410" y="128" text-anchor="middle" dominant-baseline="central" fill="rgb(8, 80, 65)" font-size="14" font-weight="500">Aktienauswahl via SDE</text>
  <text x="410" y="146" text-anchor="middle" dominant-baseline="central" fill="rgb(15, 110, 86)" font-size="12">10 profitable Aktien · Kap. 3.2</text>

  <!-- Pfeil 2 -->
  <line x1="410" y1="160" x2="410" y2="196" stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Label 3 Modelle -->
  <text x="410" y="214" text-anchor="middle" fill="rgb(61, 61, 58)" font-size="12">3 Modelle</text>

  <!-- SCHRITT 3: Verzweigung zu 3 Modellen -->
  <line x1="410" y1="218" x2="410" y2="232" stroke="rgba(31, 30, 29, 0.4)" stroke-width="1"/>
  <line x1="410" y1="232" x2="180" y2="232" stroke="rgba(31, 30, 29, 0.4)" stroke-width="1"/>
  <line x1="410" y1="232" x2="640" y2="232" stroke="rgba(31, 30, 29, 0.4)" stroke-width="1"/>
  <line x1="180" y1="232" x2="180" y2="246" stroke="rgba(31, 30, 29, 0.4)" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="410" y1="232" x2="410" y2="246" stroke="rgba(31, 30, 29, 0.4)" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="640" y1="232" x2="640" y2="246" stroke="rgba(31, 30, 29, 0.4)" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Modell 1: LinearSeparation -->
  <rect x="114" y="246" width="132" height="60" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="180" y="264" text-anchor="middle" dominant-baseline="central" fill="rgb(60, 52, 137)" font-size="14" font-weight="500">Linear</text>
  <text x="180" y="280" text-anchor="middle" dominant-baseline="central" fill="rgb(60, 52, 137)" font-size="14" font-weight="500">Separation</text>
  <text x="180" y="298" text-anchor="middle" dominant-baseline="central" fill="rgb(83, 74, 183)" font-size="11">Kap. 3.3.1</text>

  <!-- Modell 2: Preprocessed SVR -->
  <rect x="344" y="246" width="132" height="60" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="410" y="264" text-anchor="middle" dominant-baseline="central" fill="rgb(60, 52, 137)" font-size="14" font-weight="500">Preprocessed</text>
  <text x="410" y="280" text-anchor="middle" dominant-baseline="central" fill="rgb(60, 52, 137)" font-size="14" font-weight="500">SVR</text>
  <text x="410" y="298" text-anchor="middle" dominant-baseline="central" fill="rgb(83, 74, 183)" font-size="11">Kap. 3.3.2</text>

  <!-- Modell 3: TimesFM -->
  <rect x="574" y="246" width="132" height="60" rx="8" fill="rgb(238, 237, 254)" stroke="rgb(83, 74, 183)" stroke-width="0.5"/>
  <text x="640" y="268" text-anchor="middle" dominant-baseline="central" fill="rgb(60, 52, 137)" font-size="14" font-weight="500">TimesFM</text>
  <text x="640" y="290" text-anchor="middle" dominant-baseline="central" fill="rgb(83, 74, 183)" font-size="11">Kap. 3.3.3</text>

  <!-- Zusammenführung und Verzweigung nach links und rechts -->
  <line x1="180" y1="306" x2="180" y2="340" stroke="rgba(31, 30, 29, 0.4)" stroke-width="1"/>
  <line x1="410" y1="306" x2="410" y2="340" stroke="rgba(31, 30, 29, 0.4)" stroke-width="1"/>
  <line x1="640" y1="306" x2="640" y2="340" stroke="rgba(31, 30, 29, 0.4)" stroke-width="1"/>
  <line x1="180" y1="340" x2="640" y2="340" stroke="rgba(31, 30, 29, 0.4)" stroke-width="1"/>

  <!-- Verzweigung nach links und rechts -->
  <line x1="240" y1="340" x2="240" y2="380" stroke="rgba(31, 30, 29, 0.4)" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="580" y1="340" x2="580" y2="468" stroke="rgba(31, 30, 29, 0.4)" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- LINKER PFAD: Handelsstrategie -->
  <!-- Box 1 Links: Handelsstrategie -->
  <rect x="60" y="380" width="360" height="52" rx="8" fill="rgb(225, 245, 238)" stroke="rgb(15, 110, 86)" stroke-width="0.5"/>
  <text x="240" y="400" text-anchor="middle" dominant-baseline="central" fill="rgb(8, 80, 65)" font-size="14" font-weight="500">Handelsstrategie</text>
  <text x="240" y="418" text-anchor="middle" dominant-baseline="central" fill="rgb(15, 110, 86)" font-size="12">Signal-Schwelle · Half-Kelly · Kap. 3.4</text>

  <!-- Pfeil Links -->
  <line x1="240" y1="432" x2="240" y2="468" stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 2 Links: Test mit Trading - GENAU GLEICHE HÖHE WIE RECHTS (y=468) -->
  <rect x="60" y="468" width="360" height="52" rx="8" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)" stroke-width="0.5"/>
  <text x="240" y="488" text-anchor="middle" dominant-baseline="central" fill="rgb(12, 68, 124)" font-size="14" font-weight="500">Test mit Trading</text>
  <text x="240" y="506" text-anchor="middle" dominant-baseline="central" fill="rgb(24, 95, 165)" font-size="12">Backtest mit Handelsstrategie</text>

  <!-- Pfeil Links -->
  <line x1="240" y1="520" x2="240" y2="556" stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- RECHTER PFAD: Backtest ohne Trading -->
  <!-- Box 1 Rechts: Test auf historischen Daten - GENAU GLEICHE HÖHE WIE LINKS (y=468) -->
  <rect x="440" y="468" width="280" height="52" rx="8" fill="rgb(230, 241, 251)" stroke="rgb(24, 95, 165)" stroke-width="0.5"/>
  <text x="580" y="488" text-anchor="middle" dominant-baseline="central" fill="rgb(12, 68, 124)" font-size="14" font-weight="500">Test auf hist. Daten</text>
  <text x="580" y="506" text-anchor="middle" dominant-baseline="central" fill="rgb(24, 95, 165)" font-size="12">Backtest ohne Trading</text>

  <!-- Pfeil Rechts -->
  <line x1="580" y1="520" x2="580" y2="556" stroke="rgb(115, 114, 108)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 3 Links: Evaluation Finanzkennzahlen - GENAU GLEICHE HÖHE WIE RECHTS (y=556) -->
  <rect x="60" y="556" width="360" height="60" rx="8" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="240" y="580" text-anchor="middle" dominant-baseline="central" fill="rgb(99, 56, 6)" font-size="14" font-weight="500">Evaluation: Finanzkennzahlen</text>
  <text x="240" y="602" text-anchor="middle" dominant-baseline="central" fill="rgb(133, 79, 11)" font-size="11">Return · Sharpe Ratio · Max. Drawdown · Kap. 3.6.2</text>

  <!-- Box 2 Rechts: Evaluation Fehlermaße - GENAU GLEICHE HÖHE WIE LINKS (y=556) -->
  <rect x="440" y="556" width="280" height="60" rx="8" fill="rgb(250, 238, 218)" stroke="rgb(133, 79, 11)" stroke-width="0.5"/>
  <text x="580" y="580" text-anchor="middle" dominant-baseline="central" fill="rgb(99, 56, 6)" font-size="14" font-weight="500">Evaluation: Fehlermaße</text>
  <text x="580" y="602" text-anchor="middle" dominant-baseline="central" fill="rgb(133, 79, 11)" font-size="11">MAPE · RMSE · OOS-R² · DA · Kap. 3.6.1</text>

  <!-- Zusammenführung unten -->
  <line x1="240" y1="616" x2="240" y2="640" stroke="rgba(31, 30, 29, 0.4)" stroke-width="1"/>
  <line x1="580" y1="616" x2="580" y2="640" stroke="rgba(31, 30, 29, 0.4)" stroke-width="1"/>
  <line x1="240" y1="640" x2="580" y2="640" stroke="rgba(31, 30, 29, 0.4)" stroke-width="1"/>
  <line x1="410" y1="640" x2="410" y2="660" stroke="rgba(31, 30, 29, 0.4)" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- FINALE BOX: Modellvergleich -->
  <rect x="240" y="660" width="340" height="60" rx="8" fill="rgb(255, 235, 235)" stroke="rgb(180, 50, 50)" stroke-width="1.5"/>
  <text x="410" y="684" text-anchor="middle" dominant-baseline="central" fill="rgb(120, 30, 30)" font-size="16" font-weight="600">Modellvergleich</text>
  <text x="410" y="706" text-anchor="middle" dominant-baseline="central" fill="rgb(150, 40, 40)" font-size="12">Vergleich aller Metriken · Kap. 5.5</text>

</svg>
