<svg width="100%" viewBox="0 0 720 1060" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Ablaufdiagramm Studienarbeit Aktienkursvorhersage</title>
  <desc>Übersicht des methodischen Vorgehens von der Aktienauswahl über Modellentwicklung bis zur Evaluation</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- SCHRITT 1: Aktienuniversum -->
  <g>
    <rect x="190" y="20" width="340" height="60" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
    <text x="360" y="44" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#444441">Aktienuniversum</text>
    <text x="360" y="64" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#5f5e5a">S&amp;P 500 (500 Aktien)</text>
  </g>

  <!-- Pfeil 1 -->
  <line x1="360" y1="80" x2="360" y2="112" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 2: SDE Auswahl -->
  <g>
    <rect x="140" y="112" width="440" height="68" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
    <text x="360" y="136" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#085041">Aktienauswahl via SDE</text>
    <text x="360" y="160" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#0f6e56">10 profitable Aktien · Kap. 3.2</text>
  </g>

  <!-- Pfeil 2 -->
  <line x1="360" y1="180" x2="360" y2="212" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Label 3 Modelle -->
  <text x="360" y="232" text-anchor="middle" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#3d3d3a">3 Modelle</text>

  <!-- SCHRITT 3: Verzweigung zu 3 Modellen -->
  <line x1="360" y1="240" x2="360" y2="256" stroke="#737268" stroke-width="1"/>
  <line x1="360" y1="256" x2="120" y2="256" stroke="#737268" stroke-width="1"/>
  <line x1="360" y1="256" x2="600" y2="256" stroke="#737268" stroke-width="1"/>
  <line x1="120" y1="256" x2="120" y2="278" stroke="#737268" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="360" y1="256" x2="360" y2="278" stroke="#737268" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="600" y1="256" x2="600" y2="278" stroke="#737268" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Modell 1: LinearSeparation -->
  <g>
    <rect x="44" y="278" width="152" height="68" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
    <text x="120" y="298" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#3c3489">Linear</text>
    <text x="120" y="316" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#3c3489">Separation</text>
    <text x="120" y="336" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" fill="#534ab7">Kap. 3.3.1</text>
  </g>

  <!-- Modell 2: Preprocessed SVR -->
  <g>
    <rect x="284" y="278" width="152" height="68" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
    <text x="360" y="298" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#3c3489">Preprocessed</text>
    <text x="360" y="316" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#3c3489">SVR</text>
    <text x="360" y="336" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" fill="#534ab7">Kap. 3.3.2</text>
  </g>

  <!-- Modell 3: TimesFM -->
  <g>
    <rect x="524" y="278" width="152" height="68" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
    <text x="600" y="304" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#3c3489">TimesFM</text>
    <text x="600" y="328" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" fill="#534ab7">Kap. 3.3.3</text>
  </g>

  <!-- Zusammenführung und Verzweigung nach links und rechts -->
  <line x1="120" y1="346" x2="120" y2="380" stroke="#737268" stroke-width="1"/>
  <line x1="360" y1="346" x2="360" y2="380" stroke="#737268" stroke-width="1"/>
  <line x1="600" y1="346" x2="600" y2="380" stroke="#737268" stroke-width="1"/>
  <line x1="120" y1="380" x2="600" y2="380" stroke="#737268" stroke-width="1"/>

  <!-- Verzweigung nach links und rechts -->
  <line x1="200" y1="380" x2="200" y2="418" stroke="#737268" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="540" y1="380" x2="540" y2="530" stroke="#737268" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- LINKER PFAD: Handelsstrategie -->
  <g>
    <rect x="40" y="418" width="320" height="68" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
    <text x="200" y="442" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#085041">Handelsstrategie</text>
    <text x="200" y="466" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#0f6e56">Signal-Schwelle · Half-Kelly · Kap. 3.4</text>
  </g>

  <!-- Pfeil Links -->
  <line x1="200" y1="486" x2="200" y2="530" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 2 Links: Test mit Trading -->
  <g>
    <rect x="40" y="530" width="320" height="68" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
    <text x="200" y="554" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#0c447c">Test mit Trading</text>
    <text x="200" y="578" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#185fa5">Backtest mit Handelsstrategie</text>
  </g>

  <!-- Pfeil Links -->
  <line x1="200" y1="598" x2="200" y2="642" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- RECHTER PFAD: Backtest ohne Trading -->
  <g>
    <rect x="400" y="530" width="280" height="68" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
    <text x="540" y="554" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#0c447c">Test auf hist. Daten</text>
    <text x="540" y="578" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#185fa5">Backtest ohne Trading</text>
  </g>

  <!-- Pfeil Rechts -->
  <line x1="540" y1="598" x2="540" y2="642" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 3 Links: Evaluation Finanzkennzahlen -->
  <g>
    <rect x="40" y="642" width="320" height="68" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
    <text x="200" y="664" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#633806">Evaluation: Finanzkennzahlen</text>
    <text x="200" y="688" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#854f0b">Return · Sharpe Ratio · Max. Drawdown · Kap. 3.6.2</text>
  </g>

  <!-- Box 2 Rechts: Evaluation Fehlermaße -->
  <g>
    <rect x="400" y="642" width="280" height="68" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
    <text x="540" y="664" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#633806">Evaluation: Fehlermaße</text>
    <text x="540" y="688" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#854f0b">MAPE · OOS-R² · DA · Kap. 3.6.1</text>
  </g>

  <!-- Zusammenführung unten -->
  <line x1="200" y1="710" x2="200" y2="740" stroke="#737268" stroke-width="1"/>
  <line x1="540" y1="710" x2="540" y2="740" stroke="#737268" stroke-width="1"/>
  <line x1="200" y1="740" x2="540" y2="740" stroke="#737268" stroke-width="1"/>
  <line x1="360" y1="740" x2="360" y2="768" stroke="#737268" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- FINALE BOX: Modellvergleich -->
  <g>
    <rect x="190" y="768" width="340" height="60" rx="8" fill="#ffebeb" stroke="#b43232" stroke-width="1.5"/>
    <text x="360" y="792" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="16" font-weight="600" fill="#781e1e">Modellvergleich</text>
    <text x="360" y="814" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#962828">Vergleich aller Metriken · Kap. 5.5</text>
  </g>

</svg>
