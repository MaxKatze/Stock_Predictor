<svg width="100%" viewBox="0 0 720 940" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Aktienauswahl via SDE-Turnierverfahren</title>
  <desc>Ablauf der Aktienauswahl aus dem S&amp;P 500 über Faktor-Sensitivität, Poolbildung und SDE-Simulation bis zu 10 finalen Aktien</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- INPUTS -->
  <g>
    <rect x="44" y="20" width="280" height="60" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
    <text x="184" y="44" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#444441">500 Aktien</text>
    <text x="184" y="64" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#5f5e5a">Historische Kursverläufe (S&amp;P 500)</text>
  </g>
  <g>
    <rect x="396" y="20" width="280" height="60" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
    <text x="536" y="44" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#444441">6 makroökon. Faktoren</text>
    <text x="536" y="64" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#5f5e5a">Historische Zeitreihen</text>
  </g>

  <!-- Zusammenführung -->
  <line x1="184" y1="80" x2="184" y2="104" stroke="#737268" stroke-width="1"/>
  <line x1="536" y1="80" x2="536" y2="104" stroke="#737268" stroke-width="1"/>
  <line x1="184" y1="104" x2="536" y2="104" stroke="#737268" stroke-width="1"/>
  <line x1="360" y1="104" x2="360" y2="118" stroke="#737268" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- SCHRITT 1: Diskretisierung -->
  <g>
    <rect x="140" y="118" width="440" height="68" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
    <text x="360" y="142" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#085041">Diskretisierung</text>
    <text x="360" y="166" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#0f6e56">Tägliche Bewegung → +1 / 0 / -1</text>
  </g>

  <line x1="360" y1="186" x2="360" y2="218" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 2: Lineare Regression -->
  <g>
    <rect x="140" y="218" width="440" height="68" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
    <text x="360" y="242" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#085041">Faktor-Sensitivität (lineare Regression)</text>
    <text x="360" y="266" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#0f6e56">Reaktion jeder Aktie auf alle 6 Faktoren</text>
  </g>

  <line x1="360" y1="286" x2="360" y2="318" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 3: Dominantes Faktorpaar -->
  <g>
    <rect x="140" y="318" width="440" height="68" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
    <text x="360" y="342" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#085041">Dominantes Faktorpaar je Aktie</text>
    <text x="360" y="366" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#0f6e56">Top-2 Faktoren mit höchster Sensitivität</text>
  </g>

  <line x1="360" y1="386" x2="360" y2="418" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 4: Poolbildung -->
  <g>
    <rect x="140" y="418" width="440" height="68" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
    <text x="360" y="442" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#3c3489">Poolbildung nach Faktorpaar</text>
    <text x="360" y="466" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#534ab7">Aktien mit gleichem Faktorpaar → ein Pool</text>
  </g>

  <line x1="360" y1="486" x2="360" y2="518" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 5: Simulationsgruppen -->
  <g>
    <rect x="140" y="518" width="440" height="68" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
    <text x="360" y="542" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#3c3489">Simulationsgruppen (zufällig)</text>
    <text x="360" y="566" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#534ab7">4 Aktien + 2 dominante Faktoren je Gruppe</text>
  </g>

  <line x1="360" y1="586" x2="360" y2="618" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 6: SDE Simulation (Turnierbox) -->
  <g>
    <rect x="140" y="618" width="440" height="86" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
    <text x="360" y="640" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#0c447c">SDE-Simulation</text>
    <text x="360" y="664" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#185fa5">Kursverläufe simulieren → ROI je Aktie</text>
    <text x="360" y="686" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#185fa5">Gewinner (höchster ROI) verbleibt</text>
  </g>

  <!-- Rückkopplungspfeil (Turnier-Loop) -->
  <path d="M580 652 Q660 652 660 568 Q660 518 580 540" fill="none" stroke="#737268" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="684" y="588" text-anchor="middle" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#3d3d3a">wieder-</text>
  <text x="684" y="604" text-anchor="middle" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#3d3d3a">holen</text>

  <line x1="360" y1="704" x2="360" y2="736" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 7: 10 finale Aktien -->
  <g>
    <rect x="190" y="736" width="340" height="52" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
    <text x="360" y="756" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#633806">10 finale Aktien</text>
    <text x="360" y="776" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#854f0b">Basis für Modelltest</text>
  </g>
</svg>
