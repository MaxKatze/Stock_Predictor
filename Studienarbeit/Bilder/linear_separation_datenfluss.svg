<svg width="100%" viewBox="0 0 720 820" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Linear Separation Modell: Datenfluss</title>
  <desc>Ablauf des LinearSeparation-Modells von Close-Preisen über HP-Filter-Dekomposition bis zur Preisprognose</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- INPUT -->
  <g>
    <rect x="200" y="20" width="320" height="52" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
    <text x="360" y="40" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#444441">Historische Close-Preise</text>
    <text x="360" y="58" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#5f5e5a">Trainingsperiode (≥ 302 Tage nötig)</text>
  </g>

  <line x1="360" y1="72" x2="360" y2="104" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 1: Log-Transformation -->
  <g>
    <rect x="200" y="104" width="320" height="60" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
    <text x="360" y="124" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#085041">Log-Transformation</text>
    <text x="360" y="144" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#0f6e56">In: Preis p(t)</text>
    <text x="360" y="160" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#0f6e56">Out: log(p(t)) – stabilisiert Varianz</text>
  </g>

  <line x1="360" y1="164" x2="360" y2="196" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 2: HP-Filter (langfristig) -->
  <g>
    <rect x="200" y="196" width="320" height="68" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
    <text x="360" y="214" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#3c3489">HP-Filter (λ = 1600 × 252²)</text>
    <text x="360" y="234" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#534ab7">In: log(p(t))</text>
    <text x="360" y="252" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#534ab7">Out: τ_lang(t) (langfristiger Trend) + Residuum₁</text>
  </g>

  <!-- Verzweigung: Trend → OLS, Residuum → weiter -->
  <line x1="360" y1="264" x2="360" y2="284" stroke="rgba(31,30,29,0.4)" stroke-width="1"/>
  <line x1="360" y1="284" x2="180" y2="284" stroke="rgba(31,30,29,0.4)" stroke-width="1"/>
  <line x1="180" y1="284" x2="180" y2="298" stroke="rgba(31,30,29,0.4)" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="360" y1="284" x2="540" y2="284" stroke="rgba(31,30,29,0.4)" stroke-width="1"/>
  <line x1="540" y1="284" x2="540" y2="298" stroke="rgba(31,30,29,0.4)" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Links: OLS Trend lang -->
  <g>
    <rect x="80" y="298" width="200" height="60" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
    <text x="180" y="316" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="13" font-weight="500" fill="#0c447c">OLS (letzte 252 Tage)</text>
    <text x="180" y="336" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" fill="#185fa5">In: τ_lang(t)</text>
    <text x="180" y="352" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" fill="#185fa5">Out: Steigung + Achsenabschnitt</text>
  </g>

  <!-- Rechts: Residuum weiter -->
  <g>
    <rect x="440" y="298" width="200" height="60" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
    <text x="540" y="316" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="13" font-weight="500" fill="#444441">Residuum₁</text>
    <text x="540" y="336" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" fill="#5f5e5a">= log(p(t)) − τ_lang(t)</text>
    <text x="540" y="352" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" fill="#5f5e5a">→ kurzfristige Anteile</text>
  </g>

  <line x1="540" y1="358" x2="540" y2="388" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 3: HP-Filter (kurzfristig) -->
  <g>
    <rect x="380" y="388" width="320" height="68" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
    <text x="540" y="406" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#3c3489">HP-Filter (λ = 1600)</text>
    <text x="540" y="426" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#534ab7">In: Residuum₁</text>
    <text x="540" y="444" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#534ab7">Out: τ_kurz(t) (kurzfristiger Trend) + c(t)</text>
  </g>

  <!-- Verzweigung: Trend kurz → OLS, c(t) → ARMA -->
  <line x1="540" y1="456" x2="540" y2="476" stroke="rgba(31,30,29,0.4)" stroke-width="1"/>
  <line x1="540" y1="476" x2="360" y2="476" stroke="rgba(31,30,29,0.4)" stroke-width="1"/>
  <line x1="360" y1="476" x2="360" y2="490" stroke="rgba(31,30,29,0.4)" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="540" y1="476" x2="540" y2="490" stroke="rgba(31,30,29,0.4)" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Links: OLS Trend kurz -->
  <g>
    <rect x="260" y="490" width="200" height="60" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
    <text x="360" y="508" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="13" font-weight="500" fill="#0c447c">OLS (letzte 40 Tage)</text>
    <text x="360" y="528" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" fill="#185fa5">In: τ_kurz(t)</text>
    <text x="360" y="544" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" fill="#185fa5">Out: Steigung + Achsenabschnitt</text>
  </g>

  <!-- Rechts: ARMA auf c(t) -->
  <g>
    <rect x="480" y="490" width="200" height="68" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
    <text x="580" y="508" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="13" font-weight="500" fill="#0c447c">ARMA(p,q) Grid Search</text>
    <text x="580" y="528" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" fill="#185fa5">In: c(t) (zyklische Komponente)</text>
    <text x="580" y="544" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" fill="#185fa5">Auswahl: bestes (p,q) via AIC</text>
    <text x="580" y="552" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" fill="#185fa5">Out: ARMA-Koeffizienten</text>
  </g>

  <!-- Zusammenführung der 3 Pfade -->
  <line x1="180" y1="358" x2="180" y2="620" stroke="rgba(31,30,29,0.4)" stroke-width="1"/>
  <line x1="360" y1="550" x2="360" y2="620" stroke="rgba(31,30,29,0.4)" stroke-width="1"/>
  <line x1="580" y1="558" x2="580" y2="620" stroke="rgba(31,30,29,0.4)" stroke-width="1"/>
  <line x1="180" y1="620" x2="580" y2="620" stroke="rgba(31,30,29,0.4)" stroke-width="1"/>
  <line x1="360" y1="620" x2="360" y2="634" stroke="rgba(31,30,29,0.4)" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Annotations über den 3 Pfaden -->
  <text x="180" y="612" text-anchor="middle" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="10" fill="#737268" font-style="italic">τ̂_lang(t+h)</text>
  <text x="360" y="612" text-anchor="middle" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="10" fill="#737268" font-style="italic">τ̂_kurz(t+h)</text>
  <text x="580" y="612" text-anchor="middle" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="10" fill="#737268" font-style="italic">ĉ(t+h)</text>

  <!-- SCHRITT 4: Prognose-Kombination -->
  <g>
    <rect x="160" y="634" width="400" height="68" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
    <text x="360" y="652" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#085041">Komponentenaddition</text>
    <text x="360" y="672" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#0f6e56">log(p̂(t+h)) = τ̂_lang(t+h) + τ̂_kurz(t+h) + ĉ(t+h)</text>
    <text x="360" y="690" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#0f6e56">Out: Prognostizierter Log-Preis</text>
  </g>

  <line x1="360" y1="702" x2="360" y2="734" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 5: Rücktransformation -->
  <g>
    <rect x="200" y="734" width="320" height="60" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
    <text x="360" y="752" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#633806">Exp-Rücktransformation</text>
    <text x="360" y="772" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#854f0b">In: log(p̂(t+h))</text>
    <text x="360" y="788" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#854f0b">Out: p̂(t+h) = exp(log(p̂)) → Preisprognose in €</text>
  </g>
</svg>
