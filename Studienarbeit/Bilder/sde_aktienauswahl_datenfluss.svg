<svg width="100%" viewBox="0 0 720 940" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>SDE-Aktienauswahl: Datenfluss</title>
  <desc>Input/Output-Darstellung jedes Schritts der SDE-basierten Aktienauswahl</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- INPUTS -->
  <g>
    <rect x="44" y="20" width="280" height="60" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
    <text x="184" y="38" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#444441">S&amp;P 500 Kursdaten</text>
    <text x="184" y="56" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" fill="#5f5e5a">500 × tägliche Close-Preise</text>
    <text x="184" y="72" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" fill="#5f5e5a">Zeitraum: 2020–2023</text>
  </g>
  <g>
    <rect x="396" y="20" width="280" height="60" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
    <text x="536" y="38" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#444441">6 Makrofaktoren</text>
    <text x="536" y="56" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" fill="#5f5e5a">Öl · Gold · Treasury · S&amp;P 500</text>
    <text x="536" y="72" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" fill="#5f5e5a">USD-Index · Inflationserwartung</text>
  </g>

  <!-- Zusammenführung -->
  <line x1="184" y1="80" x2="184" y2="104" stroke="#737268" stroke-width="1"/>
  <line x1="536" y1="80" x2="536" y2="104" stroke="#737268" stroke-width="1"/>
  <line x1="184" y1="104" x2="536" y2="104" stroke="#737268" stroke-width="1"/>
  <line x1="360" y1="104" x2="360" y2="118" stroke="#737268" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- SCHRITT 1: Diskretisierung -->
  <g>
    <rect x="140" y="118" width="440" height="68" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
    <text x="360" y="136" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#085041">1. Diskretisierung</text>
    <text x="360" y="156" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#0f6e56">In: Tägliche Preisänderungen (Δp)</text>
    <text x="360" y="174" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#0f6e56">Out: Richtungsvektoren ∈ {−1, 0, +1} pro Tag</text>
  </g>

  <line x1="360" y1="186" x2="360" y2="218" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 2: Lineare Regression -->
  <g>
    <rect x="140" y="218" width="440" height="68" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
    <text x="360" y="236" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#085041">2. Faktor-Sensitivität (OLS)</text>
    <text x="360" y="256" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#0f6e56">In: Aktien-Richtungen + Faktor-Richtungen (Matrix)</text>
    <text x="360" y="274" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#0f6e56">Out: β-Koeffizienten je Aktie × Faktor</text>
  </g>

  <line x1="360" y1="286" x2="360" y2="318" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 3: Dominantes Faktorpaar -->
  <g>
    <rect x="140" y="318" width="440" height="68" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
    <text x="360" y="336" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#085041">3. Dominantes Faktorpaar bestimmen</text>
    <text x="360" y="356" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#0f6e56">In: |β|-Werte aller 6 Faktoren je Aktie</text>
    <text x="360" y="374" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#0f6e56">Out: Top-2-Faktorpaar mit maximaler Σ|β|</text>
  </g>

  <line x1="360" y1="386" x2="360" y2="418" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 4: Poolbildung -->
  <g>
    <rect x="140" y="418" width="440" height="68" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
    <text x="360" y="436" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#3c3489">4. Poolbildung</text>
    <text x="360" y="456" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#534ab7">In: 500 Aktien mit zugewiesenem Faktorpaar</text>
    <text x="360" y="474" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#534ab7">Out: Pools (Aktien mit identischem Faktorpaar gruppiert)</text>
  </g>

  <line x1="360" y1="486" x2="360" y2="518" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 5: Simulationsgruppen -->
  <g>
    <rect x="140" y="518" width="440" height="68" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
    <text x="360" y="536" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#3c3489">5. Zufällige Simulationsgruppen</text>
    <text x="360" y="556" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#534ab7">In: Pool mit N Aktien</text>
    <text x="360" y="574" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#534ab7">Out: Gruppen à 4 Aktien + 2 zugehörige Faktoren</text>
  </g>

  <line x1="360" y1="586" x2="360" y2="618" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 6: SDE-Simulation -->
  <g>
    <rect x="140" y="618" width="440" height="86" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
    <text x="360" y="636" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#0c447c">6. SDE-Simulation (Euler-Maruyama)</text>
    <text x="360" y="658" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#185fa5">In: Übergangswahrscheinlichkeiten P(combo) + Cholesky-Matrix B</text>
    <text x="360" y="676" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#185fa5">Prozess: S(t+1) = S(t) + μ·dt + B·dW  (378 Tage)</text>
    <text x="360" y="694" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#185fa5">Out: Simulierter ROI je Aktie → Gewinner (höchster ROI)</text>
  </g>

  <!-- Rückkopplungspfeil (Turnier-Loop) -->
  <path d="M580 652 Q660 652 660 568 Q660 518 580 540" fill="none" stroke="#737268" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="684" y="588" text-anchor="middle" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" fill="#3d3d3a">×100</text>
  <text x="684" y="604" text-anchor="middle" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" fill="#3d3d3a">Runden</text>

  <line x1="360" y1="704" x2="360" y2="736" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 7: Ranking -->
  <g>
    <rect x="140" y="736" width="440" height="68" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
    <text x="360" y="754" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#085041">7. Aggregiertes Ranking</text>
    <text x="360" y="774" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#0f6e56">In: Platzierungen aus allen 100 Simulationsrunden</text>
    <text x="360" y="792" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#0f6e56">Out: Durchschnittsrang je Aktie → Top 10 auswählen</text>
  </g>

  <line x1="360" y1="804" x2="360" y2="836" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- OUTPUT -->
  <g>
    <rect x="190" y="836" width="340" height="52" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
    <text x="360" y="856" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#633806">10 ausgewählte Aktien</text>
    <text x="360" y="874" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#854f0b">→ Modelltraining</text>
  </g>
</svg>
