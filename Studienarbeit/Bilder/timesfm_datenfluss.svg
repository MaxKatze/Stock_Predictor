<svg width="100%" viewBox="0 0 720 700" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>StockTimesFM Modell: Datenfluss</title>
  <desc>Ablauf des TimesFM Foundation Models von Close-Preisen über Log-Returns bis zur Preisprognose</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- INPUT -->
  <g>
    <rect x="200" y="20" width="320" height="60" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
    <text x="360" y="38" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#444441">Historische Close-Preise</text>
    <text x="360" y="56" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#5f5e5a">Gesamter bisheriger Kursverlauf (data_buffer)</text>
    <text x="360" y="72" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" fill="#5f5e5a">Wird täglich im Walk-Forward aktualisiert</text>
  </g>

  <line x1="360" y1="80" x2="360" y2="112" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 1: Log-Returns berechnen -->
  <g>
    <rect x="200" y="112" width="320" height="60" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
    <text x="360" y="130" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#085041">Log-Returns berechnen</text>
    <text x="360" y="150" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#0f6e56">In: Close-Preise p(t)</text>
    <text x="360" y="166" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#0f6e56">Out: r(t) = log(p(t)) − log(p(t−1))</text>
  </g>

  <line x1="360" y1="172" x2="360" y2="204" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 2: Context Window -->
  <g>
    <rect x="200" y="204" width="320" height="60" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
    <text x="360" y="222" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#085041">Context Window (512 Tage)</text>
    <text x="360" y="242" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#0f6e56">In: Alle Log-Returns r(t)</text>
    <text x="360" y="258" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#0f6e56">Out: Letzte 512 Returns als Kontext-Vektor</text>
  </g>

  <line x1="360" y1="264" x2="360" y2="296" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 3: Foundation Model -->
  <g>
    <rect x="160" y="296" width="400" height="86" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
    <text x="360" y="316" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#0c447c">TimesFM Foundation Model</text>
    <text x="360" y="336" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#185fa5">Google TimesFM 1.0 (200M Parameter, vortrainiert)</text>
    <text x="360" y="356" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#185fa5">In: Kontext-Vektor [r(t−511), …, r(t)]</text>
    <text x="360" y="374" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#185fa5">Out: Prognostizierter Log-Return r̂(t+1)</text>
  </g>

  <line x1="360" y1="382" x2="360" y2="414" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 4: Preisrekonstruktion -->
  <g>
    <rect x="200" y="414" width="320" height="68" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
    <text x="360" y="432" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#3c3489">Preisrekonstruktion</text>
    <text x="360" y="452" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#534ab7">In: r̂(t+1) + aktueller Preis p(t)</text>
    <text x="360" y="470" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#534ab7">Out: p̂(t+1) = p(t) × exp(r̂(t+1))</text>
  </g>

  <line x1="360" y1="482" x2="360" y2="514" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- OUTPUT -->
  <g>
    <rect x="200" y="514" width="320" height="45" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
    <text x="360" y="534" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#633806">Preisprognose p̂(t+1)</text>
  </g>
</svg>
