<svg width="100%" viewBox="0 0 720 920" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Gesamtüberblick: Datenfluss der Aktienkursvorhersage</title>
  <desc>Von der Datenbeschaffung über Aktienauswahl und Modelltraining bis zur Evaluation</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- SCHRITT 1: Datenquellen -->
  <g>
    <rect x="44" y="20" width="280" height="52" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
    <text x="184" y="40" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#444441">Yahoo Finance API</text>
    <text x="184" y="58" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#5f5e5a">Historische OHLCV-Kursdaten</text>
  </g>
  <g>
    <rect x="396" y="20" width="280" height="52" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
    <text x="536" y="40" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#444441">Makroökonomische Faktoren</text>
    <text x="536" y="58" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#5f5e5a">Öl, Gold, Treasury, S&amp;P 500, USD, Inflation</text>
  </g>

  <!-- Zusammenführung -->
  <line x1="184" y1="72" x2="184" y2="96" stroke="#737268" stroke-width="1"/>
  <line x1="536" y1="72" x2="536" y2="96" stroke="#737268" stroke-width="1"/>
  <line x1="184" y1="96" x2="536" y2="96" stroke="#737268" stroke-width="1"/>
  <line x1="360" y1="96" x2="360" y2="110" stroke="#737268" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- SCHRITT 2: Download & Speicherung -->
  <g>
    <rect x="170" y="110" width="380" height="52" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
    <text x="360" y="130" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#085041">Download &amp; CSV-Speicherung</text>
    <text x="360" y="148" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#0f6e56">S&amp;P 500 Universum</text>
  </g>

  <line x1="360" y1="162" x2="360" y2="198" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 3: Datensplit -->
  <g>
    <rect x="145" y="198" width="430" height="52" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
    <text x="360" y="218" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#085041">Datensplit (60 / 10 / 30)</text>
    <text x="360" y="236" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#0f6e56">Training (2020–2023) · Validation (H1/2024) · Test (H2/2024–2025)</text>
  </g>

  <line x1="360" y1="250" x2="360" y2="286" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 4: Aktienauswahl (SDE) -->
  <g>
    <rect x="170" y="286" width="380" height="52" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
    <text x="360" y="306" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#0c447c">Aktienauswahl via SDE-Turnier</text>
    <text x="360" y="324" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#185fa5">Input: 500 Aktien + 6 Faktoren → Output: 10 Aktien</text>
  </g>

  <line x1="360" y1="338" x2="360" y2="374" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 5: Modelltraining (parallel) -->
  <text x="360" y="390" text-anchor="middle" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#3d3d3a">Modelltraining auf Trainingsdaten</text>

  <line x1="360" y1="396" x2="360" y2="408" stroke="#737268" stroke-width="1"/>
  <line x1="360" y1="408" x2="120" y2="408" stroke="#737268" stroke-width="1"/>
  <line x1="360" y1="408" x2="600" y2="408" stroke="#737268" stroke-width="1"/>
  <line x1="120" y1="408" x2="120" y2="422" stroke="#737268" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="360" y1="408" x2="360" y2="422" stroke="#737268" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="600" y1="408" x2="600" y2="422" stroke="#737268" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Modell 1: Linear Separation -->
  <g>
    <rect x="44" y="422" width="152" height="65" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
    <text x="120" y="444" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="13" font-weight="500" fill="#3c3489">Linear Separation</text>
    <text x="120" y="462" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" fill="#534ab7">In: Close-Preise</text>
    <text x="120" y="476" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" fill="#534ab7">Out: Preisprognose</text>
  </g>

  <!-- Modell 2: Preprocessed SVR -->
  <g>
    <rect x="284" y="422" width="152" height="65" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
    <text x="360" y="444" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="13" font-weight="500" fill="#3c3489">Preprocessed SVR</text>
    <text x="360" y="462" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" fill="#534ab7">In: OHLCV + 14 Features</text>
    <text x="360" y="476" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" fill="#534ab7">Out: Preisprognose</text>
  </g>

  <!-- Modell 3: TimesFM -->
  <g>
    <rect x="524" y="422" width="152" height="65" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
    <text x="600" y="444" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="13" font-weight="500" fill="#3c3489">StockTimesFM</text>
    <text x="600" y="462" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" fill="#534ab7">In: Log-Returns</text>
    <text x="600" y="476" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="11" fill="#534ab7">Out: Preisprognose</text>
  </g>

  <!-- Zusammenführung nach Modellen -->
  <line x1="120" y1="487" x2="120" y2="520" stroke="#737268" stroke-width="1"/>
  <line x1="360" y1="487" x2="360" y2="520" stroke="#737268" stroke-width="1"/>
  <line x1="600" y1="487" x2="600" y2="520" stroke="#737268" stroke-width="1"/>
  <line x1="120" y1="520" x2="600" y2="520" stroke="#737268" stroke-width="1"/>
  <line x1="360" y1="520" x2="360" y2="534" stroke="#737268" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- SCHRITT 6: Handelsstrategie -->
  <g>
    <rect x="170" y="534" width="380" height="52" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
    <text x="360" y="554" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#085041">Handelsstrategie (PredictionStrategy)</text>
    <text x="360" y="572" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#0f6e56">In: Prognose + Schwellenwert → Out: Kauf-/Verkaufssignal</text>
  </g>

  <line x1="360" y1="586" x2="360" y2="622" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCHRITT 7: Walk-Forward Backtest -->
  <g>
    <rect x="170" y="622" width="380" height="52" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.5"/>
    <text x="360" y="642" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#0c447c">Walk-Forward Backtest (Backtrader)</text>
    <text x="360" y="660" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#185fa5">In: Testdaten + Modell → Out: Trades + Portfolio</text>
  </g>

  <line x1="360" y1="674" x2="360" y2="700" stroke="#737268" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Verzweigung Evaluation -->
  <line x1="360" y1="700" x2="200" y2="700" stroke="#737268" stroke-width="1"/>
  <line x1="360" y1="700" x2="520" y2="700" stroke="#737268" stroke-width="1"/>
  <line x1="200" y1="700" x2="200" y2="714" stroke="#737268" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="520" y1="700" x2="520" y2="714" stroke="#737268" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- SCHRITT 8a: Fehlermaße -->
  <g>
    <rect x="80" y="714" width="240" height="52" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
    <text x="200" y="734" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#633806">Vorhersage-Metriken</text>
    <text x="200" y="752" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#854f0b">MAPE · RMSE · OOS-R² · DA</text>
  </g>

  <!-- SCHRITT 8b: Finanz-Kennzahlen -->
  <g>
    <rect x="400" y="714" width="240" height="52" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
    <text x="520" y="734" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#633806">Finanz-Kennzahlen</text>
    <text x="520" y="752" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#854f0b">Return · Sharpe · Max Drawdown</text>
  </g>

  <!-- Zusammenführung zu Ergebnis -->
  <line x1="200" y1="766" x2="200" y2="790" stroke="#737268" stroke-width="1"/>
  <line x1="520" y1="766" x2="520" y2="790" stroke="#737268" stroke-width="1"/>
  <line x1="200" y1="790" x2="520" y2="790" stroke="#737268" stroke-width="1"/>
  <line x1="360" y1="790" x2="360" y2="804" stroke="#737268" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- SCHRITT 9: Modellvergleich -->
  <g>
    <rect x="170" y="804" width="380" height="52" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
    <text x="360" y="824" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#444441">Modellvergleich</text>
    <text x="360" y="842" text-anchor="middle" dominant-baseline="central" font-family="'Anthropic Sans', -apple-system, sans-serif" font-size="12" fill="#5f5e5a">Ranking aller Modelle über alle 10 Aktien</text>
  </g>
</svg>
